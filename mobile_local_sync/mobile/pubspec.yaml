name: baskmate
description: BaskMate - Your Emergency Pantry Next Door. Share, request, and exchange grocery items with your neighbors.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ------------------------
  # STATE MANAGEMENT
  # ------------------------
  provider: ^6.1.1

  # ------------------------
  # HTTP & API
  # ------------------------
  dio: ^5.4.0

  # ------------------------
  # LOCAL STORAGE
  # ------------------------
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0


  # ------------------------
  # UI COMPONENTS
  # ------------------------
  cupertino_icons: ^1.0.6
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0

  # ------------------------
  # FORMS & VALIDATION
  # ------------------------
  flutter_form_builder: ^10.1.0
  form_builder_validators: ^11.0.0

  # ------------------------
  # LOCATION & MAPS
  # ------------------------
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # ------------------------
  # IMAGE HANDLING
  # ------------------------
  image_picker: ^1.0.7

  # ------------------------
  # PAYMENTS
  # ------------------------
  flutter_stripe: ^10.1.1

  # ------------------------
  # UTILITIES + DEEP LINKING
  # ------------------------
  url_launcher: ^6.2.4
  connectivity_plus: ^5.0.2
  intl: ^0.20.0

  # Stripe auto-return deep link handler (REPLACES uni_links)
  app_links: ^3.4.3

  # ------------------------
  # UI HELPERS
  # ------------------------
  pull_to_refresh: ^2.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1


flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
